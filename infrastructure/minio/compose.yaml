services:
  minio:
    image: myminio:minio
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    env_file:
      - ../../../secrets/minio/.env
    volumes:
      - ../../../data/minio/minio-data:/data
      - ../../../secrets/minio/minio.license:/minio.license:ro
    command: server /data --console-address ":9001"
    networks:
      - homelab

networks:
  homelab:
    external: true
