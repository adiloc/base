- id: '1773694835955'
  alias: STYRBAR Livarno RGB Control
  triggers:
  - topic: zigbee2mqtt/0x04cd15fffe8e3374/action
    trigger: mqtt
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ action == ''on'' }}'
      sequence:
      - target:
          entity_id: '{{ light_entity }}'
        action: light.toggle
    - conditions:
      - condition: template
        value_template: '{{ action == ''off'' }}'
      sequence:
      - target:
          entity_id: '{{ light_entity }}'
        data:
          hs_color:
          - 0
          - 100
          brightness_pct: 50
        action: light.turn_on
    - conditions:
      - condition: template
        value_template: '{{ action == ''brightness_move_up'' }}'
      sequence:
      - repeat:
          while:
          - condition: template
            value_template: '{{ action != ''brightness_stop'' }}'
          sequence:
          - target:
              entity_id: '{{ light_entity }}'
            data:
              brightness_step_pct: '{{ step_pct }}'
              transition: '{{ delay_sec }}'
            action: light.turn_on
          - delay: 00:00:{{ delay_sec }}
    - conditions:
      - condition: template
        value_template: '{{ action == ''brightness_move_down'' }}'
      sequence:
      - repeat:
          while:
          - condition: template
            value_template: '{{ action != ''brightness_stop'' }}'
          sequence:
          - target:
              entity_id: '{{ light_entity }}'
            data:
              brightness_step_pct: -{{ step_pct }}
              transition: '{{ delay_sec }}'
            action: light.turn_on
          - delay: 00:00:{{ delay_sec }}
    - conditions:
      - condition: template
        value_template: '{{ action == ''arrow_left_click'' }}'
      sequence:
      - target:
          entity_id: '{{ light_entity }}'
        data:
          hs_color:
          - '{{ (state_attr(light_entity,''hs_color'')[0] - color_step) % 360 }}'
          - '{{ state_attr(light_entity,''hs_color'')[1] }}'
        action: light.turn_on
    - conditions:
      - condition: template
        value_template: '{{ action == ''arrow_right_click'' }}'
      sequence:
      - target:
          entity_id: '{{ light_entity }}'
        data:
          hs_color:
          - '{{ (state_attr(light_entity,''hs_color'')[0] + color_step) % 360 }}'
          - '{{ state_attr(light_entity,''hs_color'')[1] }}'
        action: light.turn_on
    - conditions:
      - condition: template
        value_template: '{{ action == ''arrow_left_hold'' }}'
      sequence:
      - target:
          entity_id: '{{ light_entity }}'
        data:
          color_temp_kelvin: '{{ warm_temp }}'
        action: light.turn_on
    - conditions:
      - condition: template
        value_template: '{{ action == ''arrow_right_hold'' }}'
      sequence:
      - target:
          entity_id: '{{ light_entity }}'
        data:
          color_temp_kelvin: '{{ cold_temp }}'
        action: light.turn_on
  mode: restart
  variables:
    action: '{{ trigger.payload }}'
    light_entity: light.0x588e81fffef95f97
    step_pct: 5
    delay_sec: 0.2
    color_step: 30
    warm_temp: 2700
    cold_temp: 6500
- id: '1777581635917'
