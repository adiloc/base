- id: '1782928283671'
  alias: AC Mode
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.ac_power
    - input_button.ac_fan_auto
    - input_button.ac_fan_min
    - input_button.ac_temp_16
    - input_button.ac_temp_21
    - input_button.ac_power_off_21
  actions:
  - action: remote.send_command
    target:
      entity_id: remote.broalink
    data:
      device: ac
      command: "{% if trigger.entity_id == 'input_boolean.ac_power' %}\n  {{ 'power_on'
        if is_state('input_boolean.ac_power', 'on') else 'power_off' }}\n{% elif trigger.entity_id
        == 'input_button.ac_fan_auto' %}\n  fan_auto\n{% elif trigger.entity_id ==
        'input_button.ac_fan_min' %}\n  fan_min\n{% elif trigger.entity_id == 'input_button.ac_temp_16'
        %}\n  temp_16\n{% elif trigger.entity_id == 'input_button.ac_temp_21' %}\n
        \ temp_21\n{% elif trigger.entity_id == 'input_button.ac_power_off' %}\n  power_off\n{%
        endif %}\n"
  mode: single
